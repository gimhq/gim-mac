name: GIM
options:
  bundleIdPrefix: im.g
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Shared with gim-ios by path. The gate lays gim-ios out next to gim-mac on the Mac host; on station the path
  # does not resolve and nothing builds.
  GIMKit:
    path: ../gim-ios/Packages/GIMKit
  # Vendored by scripts/sync-gim-core.sh; version in Vendor/GIMCore/GIM_CORE_VERSION.
  GIMCore:
    path: Vendor/GIMCore
targets:
  GIM:
    type: application
    platform: macOS
    sources:
      - GIM/Sources
      - path: GIM/Resources
        buildPhase: resources
    dependencies:
      - package: GIMKit
        product: GIMClientKit
      - package: GIMKit
        product: GIMFeatures
      - package: GIMCore
        product: GIMCore
    info:
      # Generated by `xcodegen generate`; merged with the generated Info.plist keys.
      path: GIM/Info.plist
      properties:
        CFBundleDisplayName: gim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Pre-filled server when none was used yet; the `-GIMDefaultServerURL <url>` launch argument overrides it.
        GIMDefaultServerURL: $(GIM_DEFAULT_SERVER_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.g.mac
        PRODUCT_NAME: GIM
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          GIM_DEFAULT_SERVER_URL: http://localhost:8080
        Release:
          GIM_DEFAULT_SERVER_URL: https://hub.g.im
  GIMTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GIM/Tests
    dependencies:
      - target: GIM
      # The tests import GIMClientKit, GIMFeatures and GIMCore directly.
      - package: GIMKit
        product: GIMClientKit
      - package: GIMKit
        product: GIMFeatures
      - package: GIMCore
        product: GIMCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.g.mac.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GIM:
    build:
      targets:
        GIM: all
    run:
      config: Debug
    test:
      config: Debug
      language: en
      region: US
      targets:
        - GIMTests
    archive:
      config: Release
